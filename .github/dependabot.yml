version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      wordpress:
        patterns: [ "@wordpress/*" ]
    ignore:
      # TypeScript 7 breaks the lint plugins; see "overrides" in package.json
      - dependency-name: typescript
        versions: [ ">=6" ]
      # A major @wordpress/scripts update changes the test runner and the lint config (v37 did): do it by hand, with CI
      - dependency-name: "@wordpress/*"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
